<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/google-trends.png' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head">
    <div class="wrap head-row">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">QCG</span><span>Quelli di Carne Genuina <em>tutorials</em></span></a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}#tutorials">Tutorials</a>
        <a href="{{ '/' | relative_url }}#tools">Tools</a>
        <a href="https://github.com/{{ site.github_user }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-foot">
    <div class="wrap foot-row">
      <p>Tutorials by <strong>Quelli di Carne Genuina</strong>, makers of the scrapers used here.</p>
      <p class="foot-links">
        <a href="https://apify.com/{{ site.apify_user }}">Apify actors</a>
        <a href="https://github.com/{{ site.github_user }}">Code on GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
    </div>
  </footer>
</body>
</html>
